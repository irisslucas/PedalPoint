spring:
  application:
    name: pedalpoint-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedalpoint}
    username: ${SPRING_DATASOURCE_USERNAME:pp}
    password: ${SPRING_DATASOURCE_PASSWORD:pp}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

pedalpoint:
  jwt:
    # Dev-only default. Set PEDALPOINT_JWT_SECRET (at least 32 bytes) in any shared or deployed environment.
    secret: ${PEDALPOINT_JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
    issuer: pedalpoint
    expiration: ${PEDALPOINT_JWT_EXPIRATION:1h}
  # Business rules (initial values from the specification; the university manager will be able to change them, epic 7)
  rules:
    min-battery-to-book: 20
