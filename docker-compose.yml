# Infrastructure as code for the stack. Start with: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedalpoint
      POSTGRES_USER: ${POSTGRES_USER:-pp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pp} -d pedalpoint"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pedalpoint
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pp}
      PEDALPOINT_TELEMETRY_MQTT_ENABLED: "true"
      PEDALPOINT_TELEMETRY_MQTT_BROKER_URL: tcp://mosquitto:1883
    ports:
      - "8080:8080"

volumes:
  db-data:
