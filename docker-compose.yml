# Infrastructure as code for the stack. Start with: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedalpoint
      POSTGRES_USER: ${POSTGRES_USER:-pp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pp} -d pedalpoint"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pedalpoint
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pp}
    ports:
      - "8080:8080"

volumes:
  db-data:
